<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6fa;
      --panel: #ffffff;
      --ink: #1c2430;
      --muted: #657184;
      --line: #e2e6ee;
      --accent: #3659d9;
      --ok: #1a8f5a;
      --warn: #b27300;
      --err: #c0392b;
      --shadow: 0 10px 28px rgba(24, 36, 56, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161f;
        --panel: #1a2230;
        --ink: #edf1f8;
        --muted: #a7b2c4;
        --line: #2c3849;
        --accent: #8fa8ff;
        --ok: #55d99b;
        --warn: #f2c45f;
        --err: #ff8b80;
        --shadow: 0 10px 28px rgba(0, 0, 0, .28);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.5rem); letter-spacing: -.04em; }
    .lede { margin: .35rem 0 0; color: var(--muted); }
    .user { margin: 0; color: var(--muted); font-size: .9rem; text-align: right; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 1rem; }
    .card {
      display: flex; flex-direction: column; min-height: 168px; padding: 1.15rem;
      color: inherit; text-decoration: none; background: var(--panel);
      border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
      transition: transform .16s ease, border-color .16s ease;
    }
    .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
    .icon {
      display: grid; place-items: center; width: 2.35rem; height: 2.35rem;
      border-radius: 11px; font-weight: 800; font-size: 1rem;
      background: color-mix(in srgb, var(--accent) 16%, var(--panel));
      color: var(--accent);
    }
    .status { display: inline-flex; align-items: center; gap: .35rem; color: var(--muted); font-size: .78rem; white-space: nowrap; }
    .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted); }
    .status.available .dot { background: var(--ok); }
    .status.starting .dot { background: var(--warn); }
    .status.unavailable .dot { background: var(--err); }
    .card h2 { margin: 1.1rem 0 .3rem; font-size: 1.06rem; letter-spacing: -.015em; }
    .desc { flex: 1; margin: 0; color: var(--muted); font-size: .9rem; }
    .open { margin-top: 1rem; color: var(--accent); font-size: .86rem; font-weight: 650; }
    .vpn { display: inline-block; margin-left: .4rem; padding: .05rem .35rem; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); font-size: .7rem; font-weight: 600; vertical-align: .1em; }
    .empty { grid-column: 1 / -1; padding: 3rem 1rem; text-align: center; color: var(--muted); }
    .error { padding: 1rem; color: var(--err); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    @media (max-width: 560px) {
      .wrap { padding-top: 2rem; }
      header { display: block; }
      .user { margin-top: .6rem; text-align: left; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>Home</h1>
        <p class="lede">Your apps, in one place.</p>
      </div>
      <p class="user" id="user"></p>
    </header>
    <section class="grid" id="apps" aria-live="polite">
      <p class="empty">Loading apps…</p>
    </section>
  </main>
  <script>
    const grid = document.getElementById('apps');
    const user = document.getElementById('user');

    function statusLabel(status) {
      if (status === 'available') return 'Available';
      if (status === 'starting') return 'Starting';
      return 'Unavailable';
    }

    function render(apps) {
      grid.replaceChildren();
      if (!apps.length) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'No apps are installed yet.';
        grid.appendChild(empty);
        return;
      }
      for (const app of apps) {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = app.url;
        card.setAttribute('aria-label', 'Open ' + app.displayName);

        const top = document.createElement('div');
        top.className = 'top';
        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = (app.displayName || app.name).slice(0, 1).toUpperCase();
        const status = document.createElement('span');
        status.className = 'status ' + (app.status || 'unavailable');
        const dot = document.createElement('span');
        dot.className = 'dot';
        const label = document.createElement('span');
        label.textContent = statusLabel(app.status);
        status.append(dot, label);
        top.append(icon, status);

        const name = document.createElement('h2');
        name.textContent = app.displayName || app.name;
        if (app.vpn) {
          const vpn = document.createElement('span');
          vpn.className = 'vpn';
          vpn.textContent = 'VPN';
          name.appendChild(vpn);
        }
        const desc = document.createElement('p');
        desc.className = 'desc';
        desc.textContent = app.description || '';
        const open = document.createElement('span');
        open.className = 'open';
        open.textContent = 'Open →';

        card.append(top, name, desc, open);
        grid.appendChild(card);
      }
    }

    async function load() {
      try {
        const res = await fetch('/api/home', { cache: 'no-store', headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        user.textContent = data.user ? 'Signed in as ' + data.user : '';
        render(data.apps || []);
      } catch (err) {
        grid.replaceChildren();
        const box = document.createElement('p');
        box.className = 'error';
        box.textContent = 'Could not load the app list. Reload the page or contact the administrator.';
        grid.appendChild(box);
      }
    }

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
