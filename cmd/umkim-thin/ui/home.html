<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6fa;
      --panel: #ffffff;
      --ink: #1c2430;
      --muted: #657184;
      --line: #e2e6ee;
      --accent: #3659d9;
      --ok: #1a8f5a;
      --warn: #b27300;
      --err: #c0392b;
      --shadow: 0 10px 28px rgba(24, 36, 56, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161f;
        --panel: #1a2230;
        --ink: #edf1f8;
        --muted: #a7b2c4;
        --line: #2c3849;
        --accent: #8fa8ff;
        --ok: #55d99b;
        --warn: #f2c45f;
        --err: #ff8b80;
        --shadow: 0 10px 28px rgba(0, 0, 0, .28);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.5rem); letter-spacing: -.04em; }
    .lede { margin: .35rem 0 0; color: var(--muted); }
    .account { text-align: right; }
    .user { margin: 0; color: var(--muted); font-size: .9rem; }
    .account-link {
      display: inline-block; margin-top: .35rem; color: var(--accent);
      font-size: .9rem; text-decoration: none; text-underline-offset: .18em;
    }
    .account-link:hover, .account-link:focus-visible { text-decoration: underline; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 1rem; }
    .card {
      display: flex; flex-direction: column; min-height: 168px; padding: 1.15rem;
      color: inherit; text-decoration: none; background: var(--panel);
      border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
      transition: transform .16s ease, border-color .16s ease;
    }
    .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
    .icon {
      display: grid; place-items: center; width: 2.35rem; height: 2.35rem;
      border-radius: 11px; font-weight: 800; font-size: 1rem;
      background: color-mix(in srgb, var(--accent) 16%, var(--panel));
      color: var(--accent);
    }
    .status { display: inline-flex; align-items: center; gap: .35rem; color: var(--muted); font-size: .78rem; white-space: nowrap; }
    .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted); }
    .status.available .dot { background: var(--ok); }
    .status.starting .dot { background: var(--warn); }
    .status.unavailable .dot { background: var(--err); }
    .card h2 { margin: 1.1rem 0 .3rem; font-size: 1.06rem; letter-spacing: -.015em; }
    .desc { flex: 1; margin: 0; color: var(--muted); font-size: .9rem; }
    .open { margin-top: 1rem; color: var(--accent); font-size: .86rem; font-weight: 650; }
    .vpn { display: inline-block; margin-left: .4rem; padding: .05rem .35rem; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); font-size: .7rem; font-weight: 600; vertical-align: .1em; }
    .empty { grid-column: 1 / -1; padding: 3rem 1rem; text-align: center; color: var(--muted); }
    .error { padding: 1rem; color: var(--err); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    @media (max-width: 560px) {
      .wrap { padding-top: 2rem; }
      header { display: block; }
      .user { margin-top: .6rem; text-align: left; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1 data-i18n="title">Home</h1>
        <p class="lede" data-i18n="lede">Your apps, in one place.</p>
      </div>
      <div class="account">
        <p class="user" id="user"></p>
        <a class="account-link" id="account" href="#" target="_blank" rel="noopener"
           title="Opens the directory (LLDAP) in a new tab; sign in with your directory account"
           data-i18n-title="accountTitle"
           data-i18n="changePassword" hidden>Change password</a>
      </div>
    </header>
    <section class="grid" id="apps" aria-live="polite">
      <p class="empty" data-i18n="loading">Loading apps…</p>
    </section>
  </main>
  <script>
    const TEXT = {
      en: {
        title: 'Home',
        lede: 'Your apps, in one place.',
        available: 'Available',
        starting: 'Starting',
        unavailable: 'Unavailable',
        open: 'Open →',
        openApp: 'Open {app}',
        vpn: 'VPN',
        loading: 'Loading apps…',
        empty: 'No apps are installed yet.',
        signedIn: 'Signed in as {user}',
        changePassword: 'Change password',
        accountTitle: 'Opens the directory (LLDAP) in a new tab; sign in with your directory account',
        loadError: 'Could not load the app list. Reload the page or contact the administrator.',
      },
      hu: {
        title: 'Otthon',
        lede: 'Az alkalmazásaid egy helyen.',
        available: 'Elérhető',
        starting: 'Indítás alatt',
        unavailable: 'Nem elérhető',
        open: 'Megnyitás →',
        openApp: '{app} megnyitása',
        vpn: 'VPN',
        loading: 'Alkalmazások betöltése…',
        empty: 'Még nincs telepített alkalmazás.',
        signedIn: 'Bejelentkezve: {user}',
        changePassword: 'Jelszó módosítása',
        accountTitle: 'Megnyitja a címtárat (LLDAP) új lapon; jelentkezz be a címtár-fiókoddal',
        loadError: 'Nem sikerült betölteni az alkalmazáslistát. Töltsd újra az oldalt, vagy keresd az adminisztrátort.',
      },
    };

    const APP_TEXT = {
      hu: {
        actualbudget: {
          description: 'Helyi elsőbbségű személyes pénzügyek és költségvetés, többfelhasználós OIDC-vel.',
        },
        gitea: {
          description: 'Könnyűsúlyú, saját üzemeltetésű Git szolgáltatás issue-kkal, PR-ekkel és CI-vel.',
        },
        homebox: {
          description: 'Háztartási leltár, garanciakövetés és eszközcímkék.',
        },
        immich: {
          description: 'Fotó- és videótár megosztással és mobilalkalmazásokkal.',
        },
        mealie: {
          description: 'Receptkezelő étkezéstervezéssel, bevásárlólistákkal és háztartási megosztással.',
        },
        nextcloud: {
          description: 'Fájlok, megosztások és együttműködés. Collabora a dokumentumszerkesztéshez.',
        },
        paperless: {
          description: 'Dokumentumarchívum OCR-rel, címkékkel és teljes szöveges kereséssel.',
        },
        sparkyfitness: {
          description: 'Egészség-, étel- és edzésnapló. Forráskód-elérhető, nem kereskedelmi; nem OSI nyílt forráskód.',
        },
        servarr: {
          jellyfin: { name: 'Jellyfin', description: 'Filmek és sorozatok nézése.' },
          seerr: { name: 'Seerr', description: 'Filmek és sorozatok kérése.' },
        },
      },
    };

    function detectLanguage() {
      const tags = Array.isArray(navigator.languages) && navigator.languages.length
        ? navigator.languages
        : [navigator.language || 'en'];
      for (const tag of tags) {
        const code = String(tag || '').toLowerCase().split('-')[0];
        if (TEXT[code]) return code;
      }
      return 'en';
    }

    function fill(template, values) {
      return template.replace(/\{(\w+)\}/g, (_, key) => values[key] ?? '');
    }

    const language = detectLanguage();
    const t = TEXT[language];
    const appText = APP_TEXT[language] || {};
    document.documentElement.lang = language;
    document.title = t.title;
    for (const el of document.querySelectorAll('[data-i18n]')) {
      const value = t[el.dataset.i18n];
      if (value) el.textContent = value;
    }
    for (const el of document.querySelectorAll('[data-i18n-title]')) {
      const value = t[el.dataset.i18nTitle];
      if (value) el.title = value;
    }

    const grid = document.getElementById('apps');
    const user = document.getElementById('user');
    const account = document.getElementById('account');

    function statusLabel(status) {
      if (status === 'available') return t.available;
      if (status === 'starting') return t.starting;
      return t.unavailable;
    }

    function render(apps) {
      grid.replaceChildren();
      if (!apps.length) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = t.empty;
        grid.appendChild(empty);
        return;
      }
      for (const app of apps) {
        const byName = appText[app.name];
        const labels = (app.route && byName && byName[app.route]) || byName || {};
        const displayName = labels.name || app.displayName || app.name;
        const description = labels.description || app.description || '';

        const card = document.createElement('a');
        card.className = 'card';
        card.href = app.url;
        card.setAttribute('aria-label', fill(t.openApp, { app: displayName }));

        const top = document.createElement('div');
        top.className = 'top';
        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = displayName.slice(0, 1).toUpperCase();
        const status = document.createElement('span');
        status.className = 'status ' + (app.status || 'unavailable');
        const dot = document.createElement('span');
        dot.className = 'dot';
        const label = document.createElement('span');
        label.textContent = statusLabel(app.status);
        status.append(dot, label);
        top.append(icon, status);

        const name = document.createElement('h2');
        name.textContent = displayName;
        if (app.vpn) {
          const vpn = document.createElement('span');
          vpn.className = 'vpn';
          vpn.textContent = t.vpn;
          name.appendChild(vpn);
        }
        const desc = document.createElement('p');
        desc.className = 'desc';
        desc.textContent = description;
        const open = document.createElement('span');
        open.className = 'open';
        open.textContent = t.open;

        card.append(top, name, desc, open);
        grid.appendChild(card);
      }
    }

    async function load() {
      try {
        const res = await fetch('/api/home', { cache: 'no-store', headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        user.textContent = data.user ? fill(t.signedIn, { user: data.user }) : '';
        // The directory (LLDAP) is where a user changes their own password.
        if (data.directoryUrl) {
          account.href = data.directoryUrl;
          account.hidden = false;
        } else {
          account.hidden = true;
        }
        render(data.apps || []);
      } catch (err) {
        grid.replaceChildren();
        const box = document.createElement('p');
        box.className = 'error';
        box.textContent = t.loadError;
        grid.appendChild(box);
      }
    }

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
