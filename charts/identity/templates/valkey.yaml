{{- if .Values.valkey.enabled }}
{{- $ns := include "identity.namespace" . -}}
{{- $password := .Values.valkey.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: valkey-auth
  namespace: {{ $ns }}
  labels:
    app: valkey
type: Opaque
stringData:
  password: {{ $password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: {{ $ns }}
  labels:
    app: valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
      annotations:
        # The password comes from a Secret; a Secret update alone does not
        # restart the pod, so roll it explicitly when the value changes.
        checksum/valkey-auth: {{ $password | sha256sum }}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ .Values.valkey.image | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ -n "$VALKEY_PASSWORD" ]; then
                exec valkey-server --save "" --appendonly no --requirepass "$VALKEY_PASSWORD"
              fi
              exec valkey-server --save "" --appendonly no
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-auth
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - |
                  if [ -n "$VALKEY_PASSWORD" ]; then export REDISCLI_AUTH="$VALKEY_PASSWORD"; fi
                  valkey-cli -h 127.0.0.1 ping | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ $ns }}
  labels:
    app: valkey
spec:
  selector:
    app: valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
