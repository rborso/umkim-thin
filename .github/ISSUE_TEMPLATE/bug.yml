name: Bug report
description: Something is broken in an install, the console, or a catalog app.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, invite links, WireGuard configs, session cookies,
        or `/etc/umkim-thin/secrets.yml`. If a secret leaked, rotate it first.
        Security issues go through SECURITY.md, not this form.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Install path
      options:
        - install.sh (single node)
        - Ansible (single node)
        - Ansible (HA)
        - Existing cluster (binary)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command or click, the expected result, and the actual result.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: "`sudo ./install.sh --doctor` (redact secrets)."
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`kubectl -n <ns> logs ...` or the console job log (redact secrets)."
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed every secret from this report.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
