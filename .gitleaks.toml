title = "umkim-thin"

# The repository contains no literal credentials. The CI scripts assemble
# per-run values into environment variables, and the chart test values are
# public fixtures; both would otherwise trip the generic-api-key rule.
[allowlist]
description = "Public CI fixtures and runtime-assembled variables"
paths = [
  '''ci/e2e.sh''',
  '''ci/test-values/.*''',
  # Render-only fixtures: public placeholders, never used by an install.
  '''install.sh''',
  '''docs/security-followup.md''',
]
