apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sillytavern
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Keep the campaign across an uninstall, the way every other app's data is
    # kept: chats and characters are the one thing here nobody can regenerate.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.sillytavern.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.sillytavern.persistence.size }}
{{- if .Values.combat.enabled }}
---
