{{- /*
  SillyTavern's config.yaml, derived from the live Magus deploy.

  The chart's defaults are merged over a minimal base, so a value the operator
  sets in `sillytavern.config` wins over the chart's, and anything neither sets
  falls back to SillyTavern's own default (SillyTavern fills missing keys at boot).

  sso.trustedProxies is the TCP source address the app sees, which in Kubernetes
  is a pod IP — so it is set to the pod CIDR, the narrowest stable range there is.
  It is empty by default because the SSO flow is off unless an operator enables it.

  privateAddressWhitelist is SillyTavern's SSRF guard. It is meant for OUTBOUND
  requests but is also applied to the inbound Host header, so behind a reverse
  proxy it rejects every request with "Rejected request from RFC1918 IP to public
  server address" — the proxy's source is a pod address. It is therefore off; the
  IP whitelist above and the portal are the inbound controls.

  enableForwardedWhitelist is off, and that is what makes a public route work.
  With it on, the whitelist middleware requires BOTH the proxy's socket address
  and the forwarded client address to be whitelisted:

      if (!inWhitelist(clientIp) || (forwardedIp && !inWhitelist(forwardedIp))) 403

  Behind a public proxy the forwarded address is a real visitor's, which is never
  in the whitelist, so every request 403s with "Rejected request from RFC1918 IP
  to public server address". With it off, only the proxy is checked, and the proxy
  is whitelisted. Enabling it does not
  harden a proxied deployment, it breaks it.
*/ -}}
{{- $base := dict
  "dataRoot" "./data"
  "listen" true
  "port" .Values.sillytavern.service.port
  "protocol" (dict "ipv4" true "ipv6" false)
  "listenAddress" (dict "ipv4" "0.0.0.0" "ipv6" "[::]")
  "dnsPreferIPv6" false
  "browserLaunch" (dict "enabled" false)
  "enableKeepAlive" false
  "ssl" (dict "enabled" false)
  "whitelistMode" true
  "enableForwardedWhitelist" false
  "whitelistDockerHosts" true
  "basicAuthUser" (dict "username" "user" "password" "password")
  "enableCorsProxy" false
  "enableDiscreetLogin" false
  "perUserBasicAuth" false
  "enableUserAccounts" false
  "hostWhitelist" (dict "enabled" false "scan" true "hosts" list)
  "sessionTimeout" -1
  "disableCsrfProtection" false
  "securityOverride" false
  "logging" (dict "enableAccessLog" true "minLogLevel" 0)
  "rateLimiting" (dict "preferRealIpHeader" false "basicAuthMaxAttempts" 5 "accountsLoginMaxAttempts" 5)
  "forwardedHeaders" (dict "xRealIp" true "xForwardedFor" true "cfConnectingIp" false)
  "backups" (dict "allowFullDataBackup" true "common" (dict "numberOfBackups" 50) "chat" (dict "enabled" true "checkIntegrity" true "maxTotalBackups" -1 "throttleInterval" 10000))
  "thumbnails" (dict "enabled" true "format" "jpg" "quality" 95)
  "performance" (dict "lazyLoadCharacters" false "memoryCacheCapacity" "100mb" "useDiskCache" true)
  "allowKeysExposure" false
  "skipContentCheck" false
  "extensions" (dict "enabled" true "autoUpdate" false)
  "enableDownloadableTokenizers" true
  "promptPlaceholder" "[Start a new chat]"
  "enableServerPlugins" true
  "enableServerPluginsAutoUpdate" false
  "sso" (dict
    "autheliaAuth" false
    "authentikAuth" false
    "trustedProxies" (list "::1" "127.0.0.1"))
  "privateAddressWhitelist" (dict
    "enabled" false
    "allowUnresolvedHosts" false
    "log" (dict "blockedRequests" true "allowedRequests" false)
    "allowedRanges" (list "127.0.0.0/8" "::1/128"))
-}}
{{- /* Deep merge: the operator's values win at every level. */ -}}
{{- $cfg := merge (deepCopy .Values.sillytavern.config) $base -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sillytavern
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yaml: |
    {{- toYaml $cfg | nindent 4 }}
