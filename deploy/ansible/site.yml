---
# Two plays: host + cluster on every node; the platform roles once, on the
# primary.
- name: host and cluster
  hosts: server
  become: true
  gather_facts: true
  # The GPU driver runs before the roles, and before k3s: it needs a reboot, and
  # a reboot is an outage. Doing it first means the single-node outage happens
  # while there is no cluster and no app to take down.
  #
  # `include_role` in pre_tasks rather than a `roles:` entry: the same role has a
  # second entry point (the device plugin, in the platform play) and `tasks_from`
  # is only honoured by include_role/import_role. As a `roles:` entry it is
  # silently ignored and the role's main.yml runs instead — which is how the
  # device plugin half was first written and never executed.
  pre_tasks:
    - include_role:
        name: gpu_node
        tasks_from: main
      tags: [gpu]
      when: gpu_enabled | default(false) | bool
  roles:
    - role: common
      tags: [common]
    - role: firewall
      tags: [firewall]
    # Host storage prerequisites must run before k3s: if a node's k3s start is
    # slow/fails, a failed host skips later roles, and the Longhorn manager then
    # crash-loops because iscsiadm is missing. longhorn_host needs no cluster.
    - role: longhorn_host
      tags: [longhorn]
      when: storage_backend | default('') == 'longhorn'
    - role: k3s
      tags: [k3s]

- name: platform
  hosts: primary
  become: true
  gather_facts: true
  roles:
    # Calico first: nothing schedules until the CNI is up.
    - role: calico
      tags: [calico]
    # Storage backend (local needs nothing; the classes come from group vars).
    - role: nfs
      tags: [nfs]
      when: (storage_backend | default('')) in ['', 'nfs'] or (nfs_mode | default('host')) == 'external'
    - role: longhorn
      tags: [longhorn]
      when: storage_backend | default('') == 'longhorn'
    - role: identity
      tags: [identity]
    - role: traefik
      tags: [traefik]
    - role: console
      tags: [console]
    - role: netpol
      tags: [netpol]
      when: enable_network_policies | default(true)
  post_tasks:
    # The device plugin cannot register anything until kubelet is up and the CNI
    # can schedule its pod, so this half runs last rather than with the driver.
    - include_role:
        name: gpu_node
        tasks_from: device_plugin
      tags: [gpu]
      when: gpu_enabled | default(false) | bool
