---
# Install Longhorn (shared, replicated storage) on the primary.
- name: longhorn | add the chart repository
  ansible.builtin.command:
    cmd: /usr/local/bin/helm repo add longhorn https://charts.longhorn.io
  register: longhorn_repo
  changed_when: "'has been added' in longhorn_repo.stdout"
  failed_when: longhorn_repo.rc != 0 and 'already exists' not in (longhorn_repo.stderr | default(''))

- name: longhorn | update chart repositories
  ansible.builtin.command: /usr/local/bin/helm repo update
  changed_when: false

- name: longhorn | install or upgrade the chart
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/helm upgrade --install longhorn longhorn/longhorn
      --namespace longhorn-system --create-namespace
      --version {{ longhorn_chart_version }}
      --kubeconfig /etc/rancher/k3s/k3s.yaml
      --set defaultSettings.defaultDataPath={{ longhorn_data_path }}
      --set defaultSettings.defaultReplicaCount={{ longhorn_replica_count }}
      --set defaultSettings.storageReservedPercentageForDefaultDisk={{ longhorn_disk_storage_reserved_percent }}
      --set defaultSettings.storageOverProvisioningPercentage={{ longhorn_storage_over_provisioning_percentage }}
      --set defaultSettings.storageMinimalAvailablePercentage={{ longhorn_storage_minimal_available_percentage }}
      --set persistence.defaultClass=false
      --wait --timeout 20m
  register: longhorn_install
  changed_when: "'has been installed' in longhorn_install.stdout or 'has been upgraded' in longhorn_install.stdout"

# We manage the storage classes ourselves so both use WaitForFirstConsumer:
# with Immediate binding an RWO volume can attach to one node while a second pod
# (e.g. an app's bootstrap Job) is scheduled to another, and the pods deadlock.
- name: longhorn | render the storage classes
  ansible.builtin.template:
    src: longhorn-storageclasses.yaml.j2
    dest: /tmp/longhorn-storageclasses.yaml
    mode: '0644'

# StorageClass parameters are immutable, so a class created by an older render
# cannot be patched: an upgrade that changes the replica count or adds a
# parameter fails with "field is immutable". Recreate the two classes when that
# happens — deleting a StorageClass never deletes a volume, and existing PVs
# keep the parameters they were provisioned with.
- name: longhorn | apply the storage classes
  ansible.builtin.shell: |
    set -o pipefail
    if /usr/local/bin/kubectl apply -f /tmp/longhorn-storageclasses.yaml 2>/tmp/longhorn-sc.err; then
      exit 0
    fi
    if ! grep -q "field is immutable" /tmp/longhorn-sc.err; then
      cat /tmp/longhorn-sc.err >&2
      exit 1
    fi
    echo "storage class parameters changed; recreating {{ longhorn_storage_class }} and {{ longhorn_rwx_storage_class }}"
    /usr/local/bin/kubectl delete storageclass {{ longhorn_storage_class }} {{ longhorn_rwx_storage_class }} --ignore-not-found
    /usr/local/bin/kubectl apply -f /tmp/longhorn-storageclasses.yaml
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

# The console's backup takes a VolumeSnapshot per application PVC. That API
# (snapshot.storage.k8s.io) is a separate project, not part of Kubernetes and
# not installed by Longhorn's chart: without it the backup is metadata-only and
# the console reports "no VolumeSnapshotClass". Install the controller and one
# class for Longhorn's driver. The version is pinned; applying an already
# present CRD is a no-op.
- name: longhorn | install the snapshot CRDs and controller
  ansible.builtin.command:
    cmd: /usr/local/bin/kubectl apply -f {{ item }}
  loop:
    - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ longhorn_snapshotter_version }}/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
    - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ longhorn_snapshotter_version }}/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
    - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ longhorn_snapshotter_version }}/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
    - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ longhorn_snapshotter_version }}/deploy/kubernetes/snapshot-controller/rbac-snapshot-controller.yaml
    - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ longhorn_snapshotter_version }}/deploy/kubernetes/snapshot-controller/setup-snapshot-controller.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  retries: 3
  delay: 5
  register: longhorn_snapshot_crds
  until: longhorn_snapshot_crds.rc == 0

- name: longhorn | wait for the snapshot controller
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/kubectl -n kube-system rollout status deploy/snapshot-controller
      --timeout=180s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: longhorn | render the volume snapshot class
  ansible.builtin.copy:
    dest: /tmp/longhorn-snapshotclass.yaml
    mode: '0644'
    content: |
      apiVersion: snapshot.storage.k8s.io/v1
      kind: VolumeSnapshotClass
      metadata:
        name: {{ longhorn_snapshot_class }}
        labels:
          app.kubernetes.io/managed-by: umkim-thin
      driver: driver.longhorn.io
      deletionPolicy: Delete
      # Longhorn's CSI driver needs the snapshot type: without it the
      # snapshotter tries a backup to an (empty) backup target and fails.
      parameters:
        type: snap

- name: longhorn | apply the volume snapshot class
  ansible.builtin.command:
    cmd: /usr/local/bin/kubectl apply -f /tmp/longhorn-snapshotclass.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: longhorn | wait for the manager
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/kubectl -n longhorn-system wait --for=condition=ready pod
      -l app=longhorn-manager --timeout=900s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

# Longhorn computes the reservation when the disk is created, so cap the disks
# that already exist as well (the setting above only seeds new ones). Without
# this a fresh HA node keeps 30% reserved and large volumes stay unschedulable.
- name: longhorn | cap the per-disk reservation
  ansible.builtin.shell: |
    set -u
    K=/usr/local/bin/kubectl
    for n in $($K -n longhorn-system get nodes.longhorn.io -o name); do
      for d in $($K -n longhorn-system get "$n" -o go-template='{% raw %}{{range $k,$v := .spec.disks}}{{$k}}{{"\n"}}{{end}}{% endraw %}'); do
        $K -n longhorn-system patch "$n" --type merge \
          -p "{\"spec\":{\"disks\":{\"$d\":{\"storageReserved\":{{ longhorn_disk_storage_reserved }}}}}}"
      done
    done
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: longhorn | stop local-path claiming the default class
  ansible.builtin.shell: |
    set -u
    K=/usr/local/bin/kubectl
    if $K get storageclass local-path >/dev/null 2>&1; then
      $K patch storageclass local-path \
        -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}' || true
    fi
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: longhorn | storage classes
  ansible.builtin.command:
    cmd: /usr/local/bin/kubectl get storageclass
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
