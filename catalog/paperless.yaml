name: paperless
displayName: Paperless-ngx
description: Document archive with OCR, tags and full-text search.

license:
  chart: Apache-2.0
  application: "GPL-3.0"
  url: "https://github.com/paperless-ngx/paperless-ngx/blob/main/LICENSE"

links:
  homepage: "https://docs.paperless-ngx.com/"
  source: "https://github.com/paperless-ngx/paperless-ngx"

chart:
  ref: oci://ghcr.io/rborso/charts/paperless
  version: 0.1.12
  versions:
    - version: 0.1.12
      appVersion: 3.3.0
      channel: stable
    - version: 0.1.11
      appVersion: 3.3.0
      channel: stable

namespace: paperless

route:
  mode: site
  host: "paperless.{{ .zone }}"
  requireAuth: true
  exposure:
    default: authelia
    allowed: [public, authelia, vpn]
  serviceName: paperless-web
  servicePort: 8000
  trusted:
    management: true
    vpn: true
  appAuth:
    kind: oidc
    note: "Authelia OIDC; Paperless mobile clients use an API token."

auth:
  # OIDC, so documents belong to real users rather than to one shared session.
  kind: oidc

oidc:
  clientId: paperless
  redirectUris:
    - "https://{{ .host }}/accounts/oidc/authelia/login/callback/"
  # django-allauth does not send a PKCE challenge.
  requirePkce: false

values:
  ocrLanguage: eng
  externalUrl: "https://{{ .host }}"
  # The search index belongs on the block-backed config class; documents and
  # the import/export directories are media and should use the shared media
  # class (external NFS on HA). Without these overrides the chart falls back to
  # the cluster default, which is Longhorn RWO on HA.
  persistence:
    data:
      size: 2Gi
      storageClass: "{{ .storage.configClass }}"
    media:
      size: 20Gi
      storageClass: "{{ .storage.mediaClass }}"
    consume:
      size: 2Gi
      storageClass: "{{ .storage.mediaClass }}"
    export:
      size: 2Gi
      storageClass: "{{ .storage.mediaClass }}"
  postgres:
    persistence:
      size: 2Gi
      storageClass: "{{ .storage.configClass }}"
  # The chart builds the OIDC CA bundle itself: the image's public roots plus
  # the optional platform CA. This works with a private CA (lab) and with a
  # public Let's Encrypt certificate (no /etc/ssl/umkim-thin/ca.crt is
  # required).

verify:
  playwright: tests/playwright/journeys/paperless.spec.ts
  checks:
    - route_reachable
    - oidc_login_redirects_to_provider
    - oidc_login_completes
    - document_list_reachable
