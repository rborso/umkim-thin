name: mealie
displayName: Mealie
description: Recipe manager with meal planning, shopping lists and household sharing.

license:
  chart: Apache-2.0
  application: "AGPL-3.0"
  url: "https://github.com/mealie-recipes/mealie/blob/mealie-next/LICENSE"

links:
  homepage: "https://mealie.io/"
  source: "https://github.com/mealie-recipes/mealie"

chart:
  ref: https://github.com/rborso/umkim-charts/tree/main/mealie
  version: 0.1.7
  versions:
    - version: 0.1.7
      appVersion: 3.31.0
      channel: stable
    - version: 0.1.6
      appVersion: 3.31.0
      channel: stable

namespace: mealie

route:
  mode: site
  host: "mealie.{{ .zone }}"
  requireAuth: true
  exposure:
    default: authelia
    allowed: [public, authelia, vpn]
  serviceName: mealie
  servicePort: 9000
  trusted:
    management: true
    vpn: true
  appAuth:
    kind: oidc
    note: "Authelia OIDC; Forage/Ghee use a Mealie API token or login."

auth:
  # OIDC, so recipes and households belong to directory users.
  kind: oidc

oidc:
  clientId: mealie
  redirectUris:
    - "https://{{ .host }}/login"

values:
  externalUrl: "https://{{ .host }}"
  persistence:
    data:
      size: 2Gi
      storageClass: "{{ .storage.configClass }}"
  postgres:
    persistence:
      size: 2Gi
      storageClass: "{{ .storage.configClass }}"
  bootstrap:
    adminEmail: "changeme@example.com"

verify:
  playwright: tests/playwright/journeys/mealie.spec.ts
  checks:
    - route_reachable
    - authenticated_request_reaches_app
    - oidc_sso_completes
    - tenant_api_mealie
  human:
    date: "2026-11-19"
    version: "0.1.7"
    by: agent
    targets: [single, ha]
    did:
      - "completed the SSO round trip as the invited tenant and read /api/users/self"
      - "created a recipe as the app admin and searched for it by name"
