name: sparkyfitness
displayName: SparkyFitness
description: Health, food and exercise tracker. Source-available and non-commercial; optional, not OSI open source.

license:
  chart: Apache-2.0
  application: "Source-available (non-commercial)"
  url: "https://github.com/CodeWithCJ/SparkyFitness/blob/main/LICENSE"
  note: "Not OSI open source. Commercial use requires the author's written permission."

links:
  homepage: "https://codewithcj.github.io/SparkyFitness/"
  source: "https://github.com/CodeWithCJ/SparkyFitness"

chart:
  ref: oci://ghcr.io/rborso/charts/sparkyfitness
  version: 0.1.0
  versions:
    - version: 0.1.0
      appVersion: 1.9.0
      channel: stable

namespace: sparkyfitness

route:
  mode: site
  host: "sparkyfitness.{{ .zone }}"
  requireAuth: true
  exposure:
    default: authelia
    allowed: [authelia, vpn]
  serviceName: sparkyfitness
  servicePort: 80
  trusted:
    management: true
    vpn: true
  appAuth:
    kind: token
    note: "The Android app uses a generated API key; the web UI keeps OIDC."

auth:
  # Authelia OIDC, so the admin panel and the per-user food diary belong to
  # directory users.
  kind: oidc

oidc:
  clientId: sparkyfitness
  # The slug is oidc.providerSlug below. SparkyFitness builds the callback from
  # its public frontend URL.
  redirectUris:
    - "https://{{ .host }}/api/auth/sso/callback/authelia"

values:
  externalUrl: "https://{{ .host }}"
  persistence:
    uploads:
      # User media, but still a single-app volume; 5Gi is enough for the
      # default install and the advanced form can move it to NFS.
      size: 5Gi
      storageClass: "{{ .storage.configClass }}"
    backup:
      size: 2Gi
      storageClass: "{{ .storage.configClass }}"
  postgres:
    persistence:
      size: 2Gi
      storageClass: "{{ .storage.configClass }}"
  server:
    # The directory admin gets the admin panel after the first OIDC login.
    adminEmail: "admin@{{ .zone }}"
    # Hide the local email/password signup and login form. Do not set
    # disableSignup: SparkyFitness uses the same user-create hook for OIDC
    # auto-registration, so disabling signup globally blocks new OIDC users.
    disableEmailLogin: true
    forceEmailLogin: false
    disableSignup: false
    # Mealie is reached at http://mealie.mealie.svc.cluster.local:9000, which
    # SparkyFitness treats as a private address. The platform is single-tenant,
    # so allow the recipe provider for invited users as well as admins.
    allowPrivateNetworkFoodProviders: true

verify:
  playwright: tests/playwright/journeys/sparkyfitness.spec.ts
  checks:
    - route_reachable
    - oidc_login_redirects_to_provider
    - oidc_login_completes
    - app_api_reachable
