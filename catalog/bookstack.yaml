name: bookstack
displayName: BookStack
description: Wiki with books, chapters and pages, and a built-in WYSIWYG/markdown editor.

license:
  chart: Apache-2.0
  application: "MIT"

links:
  homepage: "https://www.bookstackapp.com/"
  source: "https://github.com/BookStackApp/BookStack"

chart:
  ref: https://github.com/rborso/umkim-charts/tree/main/bookstack
  version: 0.1.2
  versions:
    - version: 0.1.2
      appVersion: 26.09.3
      channel: stable

namespace: bookstack

route:
  mode: site
  host: "bookstack.{{ .zone }}"
  requireAuth: true
  exposure:
    default: authelia
    allowed: [public, authelia, vpn]
  serviceName: bookstack
  servicePort: 80
  trusted:
    management: true
    vpn: true
  appAuth:
    kind: oidc
    note: "Authelia OIDC; the bootstrap admin stays as breakglass."

auth:
  kind: oidc

oidc:
  clientId: bookstack
  # BookStack implements no PKCE, so the identity client must not require it
  # (Gitea, Paperless and Vikunja are in the same position).
  requirePkce: false
  redirectUris:
    - "https://{{ .host }}/oidc/callback"

values:
  externalUrl: "https://{{ .host }}"
  persistence:
    data:
      size: 2Gi
      storageClass: "{{ .storage.configClass }}"
  database:
    persistence:
      size: 2Gi
      storageClass: "{{ .storage.configClass }}"
  bootstrap:
    adminEmail: "admin@bookstack.local"
  # Single-tenant: leave group-to-role mapping off so directory group drift
  # cannot take the wiki away from its users.
  oidc:
    userToGroups: false

verify:
  playwright: tests/playwright/journeys/bookstack.spec.ts
  checks:
    - route_reachable
    - auth_challenge
    - authenticated_request_reaches_app
    - oidc_sso_completes
    - tenant_api_bookstack
    # Mints an API token in a real SSO session (BookStack has no JSON endpoint for
    # it, and its password login is disabled under AUTH_METHOD=oidc), then writes
    # a page through /api/pages and reads it back. Proves the wiki stores content,
    # not just that SSO works.
    - bookstack_api_token_writes_page
