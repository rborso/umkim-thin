name: wireguard
displayName: WireGuard gateway
description: >
  Optional private access. Runs the VPN gateway as a workload in this cluster,
  so peers reach the apps over the overlay instead of the public internet.

license:
  chart: Apache-2.0
  application: "GPL-2.0"
  url: "https://git.zx2c4.com/wireguard-tools/tree/COPYING"
  note: "WireGuard userspace/tools; the in-cluster gateway chart is Apache-2.0."

links:
  homepage: "https://www.wireguard.com/"
  source: "https://git.zx2c4.com/wireguard-linux/"

chart:
  ref: oci://ghcr.io/rborso/charts/wireguard-gateway
  version: 0.1.4
  versions:
    - version: 0.1.4
      appVersion: 1.0.0
      channel: stable
    - version: 0.1.3
      appVersion: 1.0.0
      channel: stable
    - version: 0.1.2
      appVersion: 1.0.0
      channel: stable
    - version: 0.1.1
      appVersion: 1.0.0
      channel: stable

namespace: wireguard

# No HTTP route: the gateway is reached by UDP. Apps that need a browser
# behind the VPN use `exposure: vpn`; no-route apps simply omit the route block.

auth:
  kind: none

exposure:
  # UDP cannot go through an HTTP ingress. The operator forwards this port to
  # the cluster (NodePort on a node, or a UDP-capable load balancer); the
  # gateway binds it directly because it runs with hostNetwork.
  protocol: udp
  port: 51820

values:
  port: 51820
  subnet: "{{ .vpnSubnet }}"
  secretName: wireguard-peers
  # Trusted VPN routes use websecure + ClientIP; the gateway DNATs :443 to this
  # NodePort. Keep 30444 for a legacy <host>.vpn.<zone> vpn-entrypoint setup.
  traefikVPNPort: "{{ .traefikPort }}"
  traefikVPNHost: "{{ .traefikNodeIP }}"
  # Split DNS maps app.<zone> to the gateway for same-host trusted routes and
  # keeps the old <host>.vpn.<zone> names as a compatibility fallback.
  vpnZone: "vpn.{{ .zone }}"

verify:
  playwright: tests/playwright/journeys/wireguard.spec.ts
  checks:
    - gateway_udp_reachable
    - peer_config_generated
    - client_reaches_cluster_service
    - client_reaches_app_route
