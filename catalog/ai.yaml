name: ai
displayName: Local AI
description: Chat front end, one gateway URL, and pooled local inference backends.

license:
  chart: Apache-2.0
  application: "Mixed: MIT (Open WebUI), MIT (LiteLLM), MIT (llama.cpp)"
  url: "https://github.com/ggml-org/llama.cpp/blob/master/LICENSE"

links:
  homepage: "https://openwebui.com/"
  source: "https://github.com/rborso/umkim-thin"

chart:
  ref: https://github.com/rborso/umkim-charts/tree/main/ai
  version: 0.1.9
  versions:
    - version: 0.1.9
      appVersion: 1.83.7
      channel: stable
    - version: 0.1.8
      appVersion: 1.83.7
      channel: stable

namespace: ai

route:
  mode: site
  host: "chat.{{ .zone }}"
  requireAuth: true
  exposure:
    default: authelia
    allowed: [public, authelia, vpn]
  serviceName: ai-webui
  servicePort: 8080
  # The OpenAI-compatible API surface must reach Open WebUI without the portal
  # session, because a per-user API key is for CLIENT SOFTWARE: an editor plugin,
  # a CLI, a phone app. Those send `Authorization: Bearer sk-...` and have no
  # browser session, so Authelia's forward-auth challenge makes the key useless -
  # verified: a minted key got a 302 to the portal, never reaching the app.
  #
  # Open WebUI still authenticates every one of these requests itself (the key is
  # checked against its own database), so this exempts the portal layer, not the
  # app's auth. Same reasoning as Nextcloud's client endpoints.
  #
  # Only the endpoints a bearer-token client uses are listed. The path patterns
  # are exact, not a blanket ^/api/v1/: /api/v1/auths/ returns the signed-in
  # user's profile and is only meaningful with a browser session, so it stays
  # behind the portal.
  publicPaths:
    - "^/api/v1/models$"
    - "^/api/v1/models/"
    - "^/api/v1/chat/completions$"
    - "^/api/v1/completions$"
    - "^/api/v1/embeddings$"
    - "^/api/v1/audio/"
    - "^/api/v1/images/"
    - "^/api/v1/auths/api_key$"
    - "^/ollama/"
  trusted:
    management: true
    vpn: true
  appAuth:
    kind: oidc
    note: "Authelia OIDC; the local admin stays as breakglass."

auth:
  kind: oidc

oidc:
  clientId: openwebui
  requirePkce: false
  redirectUris:
    # Open WebUI builds this as /oauth/<provider>/callback, where the provider
    # key for a generic OIDC client is "oidc" - not the bare /oauth/callback the
    # docs show for single-provider setups. Verified from the live authorize
    # request: registering the short form made Authelia answer "The
    # 'redirect_uri' parameter does not match any of the OAuth 2.0 Client's
    # pre-registered 'redirect_uris'".
    - "https://{{ .host }}/oauth/oidc/callback"

values:
  webui:
    externalUrl: "https://{{ .host }}"
    # Seeds the first admin so the app has a user before any SSO sign-in: without
    # one every API call is 401 and the OIDC landing page has nobody to become.
    admin:
      email: "ai-admin@{{ .zone }}"
      name: "Admin"
    # Per-user API keys, so each household member can point a CLI (opencode,
    # aider), an editor plugin or a phone app at the stack:
    #
    #   client -> https://chat.<zone>/api/v1 -> Open WebUI -> LiteLLM -> backend
    #
    # They mint and revoke their own key under Settings -> Account -> API Keys;
    # the gateway keeps its own key. /api/v1 is Open WebUI's OpenAI-compatibility
    # surface, which upstream marks experimental - it covers chat completions and
    # model listing, not every OpenAI endpoint.
    apiKeys:
      enabled: true
    persistence:
      size: 2Gi
      storageClass: "{{ .storage.configClass }}"
    oidc:
      enabled: true
  # Each backend entry REPLACES the chart's list item rather than merging into
  # it, so it has to be complete - a field left out here does not fall back to
  # values.yaml, it simply is not set. That is why `models` appears again: omit it
  # and no model is downloaded, which is how the first install came up with an
  # empty /models and a backend that answered for nothing.
  backends:
    - name: llama-a
      # CPU by default: the CPU image, no device resource, no driver.
      #
      # A GPU node opts in per backend with gpu.enabled, which is the only switch:
      # the image moves to :server-cuda, nvidia.com/gpu is requested, and
      # --n-gpu-layers is passed. This default deliberately stays false so a
      # CPU-only cluster installs and passes its checks unchanged.
      #
      # The console does not make an operator edit this file. Its install panel
      # (docs/console.md -> "AI stack: models, context and GPU") asks for the
      # model, the context window, the concurrency and CPU-vs-GPU, and renders a
      # complete backend entry from those answers - the gateway model list
      # included, since backends[].models[].name and models[].upstreamModel must
      # agree. `umkim-thin ai settings` does the same from the CLI.
      image: ghcr.io/ggml-org/llama.cpp:server
      imagePullPolicy: IfNotPresent
      gpu:
        enabled: false
      models:
        - name: qwen2.5-0.5b-instruct-q4_k_m
          url: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
      modelsMax: 1
      modelsMemoryMargin: 0
      preload: qwen2.5-0.5b-instruct-q4_k_m
      ctxSize: 2048
      parallel: 1
      threads: 0
      persistence:
        size: 3Gi
        storageClass: "{{ .storage.configClass }}"
      resources:
        requests: { cpu: 250m, memory: 512Mi }
        limits: { memory: 1536Mi }

verify:
  # Two surfaces: the browser gate proves the stack answers, and a harness script
  # proves the pod-spec properties a browser cannot see (no GPU request, one
  # replica per backend).
  playwright: tests/playwright/ai.spec.ts
  harness: ci/ai-check.sh
  checks:
    - route_reachable
    - auth_challenge
    - authenticated_request_reaches_app
    - oidc_sso_completes
    - llm_models_listed
    - llm_completion_answers
    # The per-user key option, proven by a NON-admin: mint, use through /api/v1,
    # then revoke and confirm the key stops working. An admin passes even when
    # the per-user permission is off, so an admin-only test would prove nothing.
    - llm_user_api_key_lifecycle
    # And the part that actually broke: the same key used by a CLIENT with no
    # browser session. The lifecycle check above runs from the app's origin, so the
    # portal cookie rides along and it passed while curl got a 302. This one uses a
    # cookie-less request context, which is what an editor plugin or a phone app
    # does - and it is what caught the catalog's missing publicPaths.
    - llm_api_key_bearer_client
    # Tagged in ci/ai-check.sh, not the browser gate: a pod spec is not visible
    # to Playwright. The harness asserts CPU-mode on a normal target and the GPU
    # path on one that sets ai_gpu=true (the lab GPU host), so both contracts are
    # covered by the code that can actually see the pod spec.
    - llm_cpu_mode_requests_no_gpu
    - llm_backends_are_separate
    - tenant_api_ai
  human:
    date: "2026-11-21"
    version: "0.1.9"
    by: agent
    targets: [single]
    did:
      - "the earlier 0.1.7 pass on dev-single and ha-dev still holds: install, OIDC tenant sign-in, CPU mode requesting no GPU, and a non-admin minting and revoking their own key"
      - "0.1.9 on the GPU host (Pascal GTX 1050 Ti, 4 GiB): sampling defaults and the layer count reach the pod spec - --temp 0.2, --top-p 0.9, --top-k 20, --min-p 0.05, --n-gpu-layers 24 all verified in the running Deployment"
      - "the server defaults actually apply and can still be overridden per request: six unseeded completions at the configured temp 0.2 gave 4 distinct answers, while the same six with temperature 1.9, top_p 1.0 and top_k 0 sent in the request gave 6 distinct"
      - "a non-admin minted a key in a browser and used it from curl with only the bearer token - GET /api/v1/models returned the model list and a chat completion answered - then revoked it and the same key got 401"
      - "found and fixed the reason that key could not work before: Authelia's forward-auth intercepted /api/v1/* and returned a 302 to the portal, so the token never reached Open WebUI. The catalog entry now exempts the bearer endpoints by exact path"
      - "switched the model set through the console API (1.5B added alongside 0.5B, context 4096, parallel 1): both GGUFs landed on the volume, the gateway published both friendly names, and both answered through the gateway"
      - "confirmed the memory warning is calibrated rather than decorative: 0.5B q4 at 2048 context reported 'about 28 MiB of cache' and the engine measured 491 MiB resident on the card"
