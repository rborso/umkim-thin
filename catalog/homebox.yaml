name: homebox
displayName: HomeBox
description: Household inventory, warranty tracking and asset labels.

license:
  chart: Apache-2.0
  application: "AGPL-3.0"
  url: "https://github.com/sysadminsmedia/homebox/blob/main/LICENSE"

links:
  homepage: "https://homebox.software/"
  source: "https://github.com/sysadminsmedia/homebox"

chart:
  ref: https://github.com/rborso/umkim-charts/tree/main/homebox
  version: 0.1.2
  versions:
    - version: 0.1.2
      appVersion: 0.27.1
      channel: stable
    - version: 0.1.1
      appVersion: 0.27.1
      channel: stable

namespace: homebox

route:
  mode: site
  host: "homebox.{{ .zone }}"
  requireAuth: true
  exposure:
    default: authelia
    allowed: [public, authelia, vpn]
  serviceName: homebox
  servicePort: 7745
  trusted:
    management: true
    vpn: true
  appAuth:
    kind: oidc
    note: "Authelia OIDC for the PWA."

auth:
  # HomeBox has its own OIDC provider; the portal adds the household gate.
  kind: oidc

oidc:
  clientId: homebox
  redirectUris:
    - "https://{{ .host }}/api/v1/users/login/oidc/callback"

values:
  externalUrl: "https://{{ .host }}"
  hostname: "{{ .host }}"
  persistence:
    data:
      storageClass: "{{ .storage.configClass }}"

verify:
  playwright: tests/playwright/journeys/homebox.spec.ts
  checks:
    - route_reachable
    - authenticated_request_reaches_app
    - oidc_sso_completes
    - tenant_api_homebox
  human:
    date: "2026-11-19"
    version: "0.1.2"
    by: agent
    targets: [single, ha]
    did:
      - "completed the SSO round trip as the invited tenant and read /api/v1/users/self"
      - "created a location and an item with a photo, searched for it, and exported the inventory"
